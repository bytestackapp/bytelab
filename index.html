<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bytestack Office</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#efe7d8;--panel:rgba(255,251,243,.93);--ink:#2d2a26;--mute:#7a7164;--line:rgba(60,45,25,.16)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1c1a17;--panel:rgba(46,41,35,.93);--ink:#f0e9dc;--mute:#b3a994;--line:rgba(255,240,215,.16)}}
:root[data-theme="dark"]{--bg:#1c1a17;--panel:rgba(46,41,35,.93);--ink:#f0e9dc;--mute:#b3a994;--line:rgba(255,240,215,.16)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;overflow:hidden;touch-action:none}
#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
.top{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
h1{font-size:16px;font-weight:600;margin:0;background:var(--panel);padding:8px 11px;border-radius:12px;border:1px solid var(--line)}
.btns{display:flex;gap:6px}
button,input{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
button{cursor:pointer}button.on{background:#8fae8a;color:#1d2a30;border-color:#8fae8a}
button:focus-visible,input:focus-visible{outline:2px solid #8fae8a;outline-offset:2px}
.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 160px);text-align:center;font-size:12px;color:var(--mute);pointer-events:none}
.task{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 114px);display:none;gap:6px}
.task input{flex:1;min-width:0}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px;overflow-x:auto}
.card{flex:0 0 150px;text-align:left;padding:9px 11px;border-radius:14px}
.card.sel{border-color:#8fae8a;box-shadow:0 0 0 2px #8fae8a88}
.nm{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.rl{font-size:12px;color:var(--mute)}.st{font-size:12px;margin-top:4px;min-height:30px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
#res{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 62px);max-height:52vh;overflow:auto;display:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45}
#res h2{font-size:15px;margin:0 0 6px;font-weight:600}#res p{margin:0 0 8px;white-space:pre-wrap}
.tag{position:fixed;left:0;top:0;transform:translate(-50%,-100%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px 8px;font-size:11px;white-space:nowrap;text-align:center;line-height:1.25;cursor:pointer}
.zone{cursor:default;pointer-events:none;color:var(--ink);opacity:.72;background:transparent;border:0;font-size:12px;font-weight:600;letter-spacing:.02em}
</style>
</head>
<body>
<div id="stage"></div>
<div class="top"><h1>Bytestack Office</h1><div class="btns"><button id="mb">Meeting</button><button id="lb">Log</button><button id="rb">Reset</button></div></div>
<div class="hint">Drag to orbit. W A S D to walk. Scroll or pinch to zoom. Tap a name to inspect.</div>
<div id="res"><h2 id="rt"></h2><p id="rp"></p><button id="rc">Close</button></div>
<div class="task" id="task"><input id="tin" placeholder="Give the Manager an objective" maxlength="240"><button id="go">Assign</button></div>
<div class="dock" id="dock"></div>
<script>
// ===== 1. Event bus and agent state (the source of truth; the 3D scene only reads this) =====

const R=[['Ava','Operations Manager',0xf2a541,'THINKING','mgmt',0],['Hana','HR Specialist',0x4fb7d9,'ANALYZING','hr',0],['Rex','Research Specialist',0x35b0ab,'RESEARCHING','research',0],['Pia','Product Analyst',0xe68fd0,'ANALYZING','research',1],['Arlo','Software Architect',0x5a8dee,'ANALYZING','arch',0],['Kit','Software Developer',0x8e7dff,'CODING','dev',0],['Dax','Data Specialist',0xd9b44a,'ANALYZING','db',0],['Quinn','QA Specialist',0x5cc275,'TESTING','qa',0],['Sera','Security Specialist',0xe85d5d,'ANALYZING','sec',0],['Uma','UI/UX Specialist',0xff9f6b,'ANALYZING','uiux',0]];

// floor plan: three room rows, two horizontal corridors, one vertical corridor on the right
const RM={mgmt:{n:'Management',x:[-18,-12],row:1,desks:1},hr:{n:'HR',x:[-12,-6],row:1,desks:1},research:{n:'Research',x:[-6,0],row:1,desks:2},arch:{n:'Architecture',x:[0,6],row:1,desks:2},dev:{n:'Development',x:[6,16],row:1,desks:3},
 db:{n:'Database',x:[-18,-12],row:2,desks:2,d:1},qa:{n:'QA Lab',x:[-12,-6],row:2,desks:2,d:1},sec:{n:'Security',x:[-6,0],row:2,desks:2,d:1},uiux:{n:'UI/UX Studio',x:[0,6],row:2,desks:2},conf:{n:'Conference Room',x:[6,16],row:2},
 recep:{n:'Bytestack Reception',x:[-18,-12],row:3},lounge:{n:'Lounge and Pantry',x:[-12,10],row:3,dx:-9},server:{n:'Server Room',x:[10,13],row:3},rest:{n:'Restroom and Storage',x:[13,16],row:3}};
const ROWS={1:[-14,-7,-5.5,-7],2:[-4,3,-5.5,-4],3:[6,14,4.5,6]};
Object.entries(RM).forEach(([k,m])=>{const q=ROWS[m.row];Object.assign(m,{k,z0:q[0],z1:q[1],cz:q[2],dz:q[3],dx:m.dx??m.x[1]-.7,cx:(m.x[0]+m.x[1])/2})});
const DK=R.map(q=>{const m=RM[q[4]];return [m.x[0]+(q[5]+1)*(m.x[1]-m.x[0])/(m.desks+1),m.z0+2.6]});
const spot=(w,i)=>w==='desk'?[DK[i][0],DK[i][1]-.9]:w==='meet'?[8+1.5*(i%5),i<5?-2.3:1.2]:w==='pantry'?[-2.2+i*.95,7.7]:[-7.5+Math.cos(i/10*6.283)*2.3,10+Math.sin(i/10*6.283)*2.1];

const ag=R.map((q,i)=>({i,n:q[0],role:q[1],work:'IDLE',office:'LOUNGE',task:null,since:Date.now(),res:null,job:false,path:[],dk:'lounge',room:'lounge'}));

const LEIS={coffee:{t:'coffee break',o:'PANTRY',s:Array.from({length:10},(_,k)=>[-2.2+k*.95,7.7,Math.PI])},

const occ={};
function pick(o){const ks=Object.keys(LEIS).filter(k=>k!==o.act),k=ks[Math.floor(Math.random()*ks.length)];

// ===== 2. Orchestration: real Claude calls drive the state above =====
let meeting=false,busyAll=false;
const KEY='office_key';
function getKey(force){let k='';try{k=force?'':localStorage.getItem(KEY)||''}catch(e){}

 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed ('+r.status+')');return j.text}

async function submit(){
 const g=tin.value.trim();if(!g||busyAll||meeting)return;tin.value='';busyAll=true;
 const m=ag[0];setWork(m,'THINKING','Planning: '+g.slice(0,50));m.job=true;m.res=null;bus.emit('agent.task_assigned','Ava',g);
 let plan;
 try{plan=await askJson('You are Ava, AI Operations Manager of Bytestack, a reusable AI company. Owner objective: '+g+'\nSpecialists: Rex (Researcher), Pia (Product Analyst), Arlo (Architect), Kit (Developer), Dax (Data), Quinn (QA), Sera (Security), Uma (UI/UX), Hana (HR). Pick only those needed, max 5. Return JSON only: {"tasks":[{"agent":"Name","task":"one sentence"}]}')}
 catch(e){m.job=false;m.res='Could not plan: '+((e&&e.message)||'error');bus.emit('agent.task_failed','Ava',m.res);setWork(m,'BLOCKED');setTimeout(()=>setWork(m,'IDLE',null),4000);busyAll=false;return}
 let T=((plan&&plan.tasks)||[]).filter(t=>byN[t.agent]&&t.agent!=='Ava').slice(0,5);if(!T.length)T=[{agent:'Rex',task:g}];
 let s2=T.filter(t=>t.agent==='Quinn'||t.agent==='Sera'),s1=T.filter(t=>!s2.includes(t));if(!s1.length){s1=s2;s2=[]}
 m.job=false;setWork(m,'WAITING','Waiting on '+T.map(t=>t.agent).join(', '));
 const o1=await Promise.all(s1.map(t=>work(byN[t.agent],String(t.task))));
 const c1=s1.map((t,i)=>t.agent+': '+o1[i]).join('\n');
 const o2=await Promise.all(s2.map(t=>work(byN[t.agent],String(t.task),c1)));
 await work(m,'Review the results and write the final report for: '+g,c1+'\n'+s2.map((t,i)=>t.agent+': '+o2[i]).join('\n'));

// ===== 3. UI helpers =====
const res=document.getElementById('res');
function showRes(t,x){document.getElementById('rt').textContent=t;document.getElementById('rp').textContent=x;res.style.display='block'}

const fmt=e=>new Date(e.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'  '+e.agent+'  '+e.type.replace('agent.','')+(e.detail?': '+e.detail.slice(0,70):'');
const dur=ms=>ms<6e4?Math.round(ms/1e3)+'s':Math.round(ms/6e4)+' min';
function inspect(o){const rec=bus.L.filter(e=>e.agent===o.n).slice(-4).reverse().map(fmt).join('\n')||'None yet';
 showRes(o.n+', '+o.role,'Task: '+(o.task||'none')+'\nWork state: '+o.work+'\nOffice state: '+o.office+'\nIn this state for: '+dur(Date.now()-o.since)+'\n\nRecent activity\n'+rec+(o.res?'\n\nLatest result\n'+o.res:''))}
document.getElementById('lb').onclick=()=>showRes('Activity log',bus.L.slice(-30).reverse().map(fmt).join('\n')||'No activity yet');
document.getElementById('mb').onclick=function(){if(!meeting&&busyAll)return;meeting=!meeting;this.classList.toggle('on',meeting);
 ag.forEach(o=>setWork(o,meeting?'IN_MEETING':'IDLE',meeting?'Team meeting':null));bus.emit(meeting?'agent.entered_meeting':'agent.left_meeting','All')};
document.getElementById('go').onclick=submit;tin.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
document.getElementById('task').style.display='flex';
// ===== 4. 3D scene: Warm Contemporary cutaway (visualization only) =====
const dark=matchMedia('(prefers-color-scheme: dark)').matches;

const cam=new THREE.PerspectiveCamera(45,1,.1,150);

box(38,.2,28,OAK,1,-.1,0);box(34,.03,3,0xe8dcc6,-1,.01,-5.5);box(34,.03,3,0xe8dcc6,-1,.01,4.5);box(4,.03,28,0xe8dcc6,18,.01,0);

  box(.8,.5,.05,DARK,x,1.08,z+.18).rotation.x=-.15;box(.12,.12,.02,c,x,1.08,z+.215).rotation.x=-.15;
  box(.8,.1,.8,CHAIR,x,.45,z-.9);box(.8,.7,.1,CHAIR,x,.85,z-1.3)}
 plant(a+.6,m.z0+.7);box(.9,1.5,.5,LIGHT,a+1.6,.75,m.z0+.4);
 if(m.row===1)box(2.6,1.2,.05,0xcfe6ee,m.cx,1.8,-13.88,0x8fc3d6);

});
// conference room: table, ten chairs (the same seats agents use), display, rug
box(7,.12,2.4,DESK,11,.75,-.5);box(.3,.7,1.6,DARK,9,.38,-.5);box(.3,.7,1.6,DARK,13,.38,-.5);box(4,1.8,.06,DARK,11,1.6,-3.88,0x20384a);box(.3,.2,.2,DARK,11,.88,-.5);

 const g=o.g;let w=WANT[o.work]||(o.work==='IDLE'?'leisure':'lounge');

 if(o.path.length&&o.dk[0]==='L'&&!L&&g.position.x>-12&&g.position.x<10&&g.position.z>6)o.path=[];

 const seated=!mv&&(w==='desk'||w==='meet'||(L&&L.sit)),off=mv?'WALKING':(L?L.o:OFF[w]);
 if(off!==o.office){o.office=off;if(off!=='WALKING'&&(!L||off==='PANTRY'))bus.emit('agent.office_state',o.n,off)}

 if(mv)o.inn.position.y=Math.abs(Math.sin(t*10))*.05;
